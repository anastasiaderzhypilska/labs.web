<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Zoo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Edit Zoo</h1>

  <form id="editForm">
    <label>Name: <input type="text" id="name" required></label><br><br>
    <label>Visitors: <input type="number" id="visitors" required></label><br><br>
    <label>Animals: <input type="number" id="animals" required></label><br><br>
    <label>Type: <input type="text" id="type" required></label><br><br>
    <button type="submit">Save</button>
    <button type="button" id="cancelEdit">Cancel</button>
  </form>

  <script src="app.js"></script>
  <script>
    document.getElementById('cancelEdit').addEventListener('click', () => {
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
